<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider Web</title>
    <style>
      :root {
        --bg1: #0a0f1c;
        --bg2: #101c2d;
        --web: rgba(214, 231, 255, 0.7);
        --web-bright: rgba(255, 255, 255, 0.9);
        --shadow: rgba(0, 0, 0, 0.35);
        --spider: #0a0a0a;
        --highlight: rgba(255, 255, 255, 0.16);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at center, rgba(36, 46, 66, 0.9), rgba(8, 11, 18, 0.98) 58%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .scene {
        position: relative;
        width: min(70vmin, 520px);
        height: min(70vmin, 520px);
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.38));
      }

      .web {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .ring,
      .line,
      .spoke {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center center;
      }

      .ring {
        width: 140px;
        height: 140px;
        margin-left: -70px;
        margin-top: -70px;
        border: 1px solid var(--web);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.02);
        box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.05), 0 0 10px rgba(255,255,255,0.04);
      }

      .spoke {
        width: 50%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--web-bright), transparent);
        transform: translate(-50%, -50%) rotate(0deg);
        opacity: 0.9;
      }

      .line {
        width: 1px;
        height: 50%;
        background: linear-gradient(180deg, transparent, var(--web), transparent);
        transform: translate(-50%, -50%) rotate(0deg);
        opacity: 0.85;
      }

      .web::before {
        content: "";
        position: absolute;
        inset: 9%;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 28px rgba(255,255,255,0.03);
      }

      .web::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255,255,255,0.12);
        box-shadow: 0 0 12px rgba(255,255,255,0.15);
      }

      .spider {
        position: absolute;
        left: 50%;
        top: 51%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        animation: sway 4s ease-in-out infinite;
      }

      .spider .body {
        position: absolute;
        left: 50%;
        top: 56%;
        width: 18px;
        height: 24px;
        transform: translate(-50%, -50%);
        border-radius: 50% 50% 45% 45%;
        background: var(--spider);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
      }

      .spider .body::before,
      .spider .body::after {
        content: "";
        position: absolute;
        background: var(--spider);
        border-radius: 50%;
      }

      .spider .body::before {
        left: -8px;
        top: 6px;
        width: 10px;
        height: 18px;
        transform: rotate(-18deg);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .spider .body::after {
        right: -8px;
        top: 6px;
        width: 10px;
        height: 18px;
        transform: rotate(18deg);
      }

      .spider .head {
        position: absolute;
        left: 50%;
        top: 38%;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: var(--spider);
      }

      .spider .head::before,
      .spider .head::after {
        content: "";
        position: absolute;
        top: 5px;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(255,255,255,0.6);
      }

      .spider .head::before { left: 4px; }
      .spider .head::after { right: 4px; }

      .spider .leg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(0,0,0,0.9), transparent);
        transform-origin: 0 50%;
      }

      .spider .leg.left1  { transform: translate(-10px, 5px) rotate(-32deg); }
      .spider .leg.left2  { transform: translate(-10px, 12px) rotate(-18deg); }
      .spider .leg.left3  { transform: translate(-12px, 20px) rotate(-4deg); }
      .spider .leg.left4  { transform: translate(-10px, 28px) rotate(12deg); }
      .spider .leg.right1 { transform: translate(58px, 5px) rotate(32deg); }
      .spider .leg.right2 { transform: translate(58px, 12px) rotate(18deg); }
      .spider .leg.right3 { transform: translate(60px, 20px) rotate(4deg); }
      .spider .leg.right4 { transform: translate(58px, 28px) rotate(-12deg); }

      .spider .thread {
        position: absolute;
        left: 50%;
        top: -28px;
        width: 2px;
        height: 140px;
        border-radius: 2px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(160,180,210,0.45), transparent);
        opacity: 0.8;
      }

      @keyframes sway {
        0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
        50% { transform: translate(-50%, -52%) rotate(4deg); }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-label="Spider web illustration">
      <div class="web" id="web"></div>
      <div class="spider" aria-hidden="true">
        <span class="thread"></span>
        <span class="head"></span>
        <span class="body"></span>
        <span class="leg left1"></span>
        <span class="leg left2"></span>
        <span class="leg left3"></span>
        <span class="leg left4"></span>
        <span class="leg right1"></span>
        <span class="leg right2"></span>
        <span class="leg right3"></span>
        <span class="leg right4"></span>
      </div>
    </div>

    <script>
      const web = document.getElementById('web');

      for (let i = 1; i <= 8; i++) {
        const ring = document.createElement('span');
        ring.className = 'ring';
        const size = 50 + i * 38;
        ring.style.width = `${size}px`;
        ring.style.height = `${size}px`;
        ring.style.marginLeft = `${-size / 2}px`;
        ring.style.marginTop = `${-size / 2}px`;
        web.appendChild(ring);
      }

      for (let i = 0; i < 12; i++) {
        const spoke = document.createElement('span');
        spoke.className = 'spoke';
        spoke.style.transform = `translate(-50%, -50%) rotate(${i * 30}deg)`;
        web.appendChild(spoke);
      }

      for (let i = 0; i < 12; i++) {
        const line = document.createElement('span');
        line.className = 'line';
        line.style.transform = `translate(-50%, -50%) rotate(${i * 30}deg)`;
        web.appendChild(line);
      }
    </script>
  </body>
</html>
